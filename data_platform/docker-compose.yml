services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: homepedia-postgres
    environment:
      POSTGRES_USER: homepedia
      POSTGRES_PASSWORD: homepedia
      POSTGRES_DB: homepedia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init_postgres.sql:/docker-entrypoint-initdb.d/01_init_postgis.sql:ro
      - ./sql/init_test_database.sh:/docker-entrypoint-initdb.d/02_init_test_database.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homepedia -d homepedia"]
      interval: 5s
      timeout: 5s
      retries: 10

  spark-master:
    image: apache/spark:3.5.0
    container_name: homepedia-spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark:/opt/spark/homepedia
      - ./tests/fixtures:/opt/spark/fixtures

  spark-worker:
    image: apache/spark:3.5.0
    container_name: homepedia-spark-worker
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_CORES: 2
    depends_on:
      - spark-master
    volumes:
      - spark_events:/tmp/spark-events
      - ./spark:/opt/spark/homepedia
      - ./tests/fixtures:/opt/spark/fixtures

  spark-history:
    image: apache/spark:3.5.0
    container_name: homepedia-spark-history
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    environment:
      SPARK_HISTORY_OPTS: "-Dspark.history.fs.logDirectory=/tmp/spark-events"
    ports:
      - "18080:18080"
    depends_on:
      - spark-master
    volumes:
      - spark_events:/tmp/spark-events

volumes:
  postgres_data:
  spark_events:
