# HDFS (data lake) + Spark (distributed cleaning) cluster for Homepedia.
#
# This is the "Big Data" layer of the architecture (docs/guide_fr.md §3):
#   ingestion -> HDFS (immutable raw files) -> Spark (clean at scale) -> Postgres raw_*
#
# Services:
#   namenode      HDFS master   - web UI http://localhost:9870 , fs hdfs://localhost:9000
#   datanode      HDFS storage  - web UI http://localhost:9864
#   spark-master  Spark master  - web UI http://localhost:8080 , submit spark://localhost:7077
#   spark-worker  Spark executor- web UI http://localhost:8081
#
# Bring it up:   docker compose -f docker-compose.yml up -d
# The spark code lives in ./ and is mounted read-only into the Spark containers at /opt/homepedia.

services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: homepedia-namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=homepedia
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"   # NameNode web UI
      - "9000:9000"   # fs.defaultFS (HDFS RPC)
    volumes:
      - namenode_data:/hadoop/dfs/name
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9870/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: homepedia-datanode
    restart: unless-stopped
    environment:
      - SERVICE_PRECONDITION=namenode:9870
    env_file:
      - ./hadoop.env
    ports:
      - "9864:9864"   # DataNode web UI
    volumes:
      - datanode_data:/hadoop/dfs/data
    depends_on:
      - namenode

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: homepedia-spark-master
    restart: unless-stopped
    environment:
      - INIT_DAEMON_STEP=setup_spark
    env_file:
      - ./hadoop.env
    ports:
      - "8080:8080"   # Spark master web UI
      - "7077:7077"   # Spark submit endpoint
    volumes:
      - ./:/opt/homepedia:ro          # spark jobs + utils, available inside the cluster
      - ../tests:/opt/data:ro         # sample fixtures, for hdfs_put_raw.sh and local runs

  spark-worker:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: homepedia-spark-worker
    restart: unless-stopped
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
    env_file:
      - ./hadoop.env
    ports:
      - "8081:8081"   # Spark worker web UI
    volumes:
      - ./:/opt/homepedia:ro
      - ../tests:/opt/data:ro
    depends_on:
      - spark-master

volumes:
  namenode_data:
  datanode_data:
