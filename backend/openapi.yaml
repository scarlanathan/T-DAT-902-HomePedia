openapi: 3.0.0
paths:
  /:
    get:
      operationId: AppController_getRoot
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  status:
                    type: string
                required:
                  - name
                  - status
      tags:
        - meta
  /health:
    get:
      operationId: HealthController_getHealth
      parameters: []
      responses:
        "200":
          description: ""
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  postgres:
                    type: string
                    enum:
                      - up
                      - down
                required:
                  - status
                  - postgres
      tags:
        - health
